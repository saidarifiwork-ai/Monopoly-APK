name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, flutter-android-download]
    paths:
      - 'app.js'
      - 'art.js'
      - 'style.css'
      - 'index.html'
      - 'server.js'
      - 'presence.js'
      - 'test/**'
      - 'package*.json'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'art.js'
      - 'style.css'
      - 'index.html'
      - 'server.js'
      - 'presence.js'
      - 'test/**'
      - 'package*.json'
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test test/*.test.js
        working-directory: .
      - run: npm ci
        working-directory: .
      - run: python3 tool/sync_game_assets.py
      - name: Verify committed mobile renderer matches the web
        run: git diff --exit-code -- assets/game
      - name: Start shared server
        working-directory: .
        run: |
          node server.js > /tmp/quartiers-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/quartiers-server.log
          exit 1
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --dart-define=SMOKE_SERVER=http://127.0.0.1:8787
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: quartiers-maroc-android-test
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
